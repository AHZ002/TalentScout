[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talentscout"
version = "0.1.0"
description = "Agentic AI platform for adaptive technical screening and candidate intelligence."
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.139,<0.140",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
    "mypy>=1.20,<2",
    "librt==0.13.0",
    "httpx2>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["backend/src"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-dir]
"" = "backend/src"
