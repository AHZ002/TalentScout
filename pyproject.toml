[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talentscout"
version = "0.1.0"
description = "Agentic AI platform for adaptive technical screening and candidate intelligence."
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.139,<0.140",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0.51,<2.1",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.18.5,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "pgvector>=0.4,<1",
    "google-genai>=1,<2",
    "groq>=0.31,<1",
    "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
    "mypy>=1.20,<2",
    "librt==0.13.0",
    "httpx2>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-per-file-ignores = { "backend/src/talentscout/**/api/*.py" = ["B008"] }

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend/src"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-dir]
"" = "backend/src"
